[package]
name = "rust-template"
version = "0.15.1"
edition = "2024"
rust-version = "1.98.1"
description = "rust template"
readme = "README.md"
repository = "https://trev.zip/template/rust"
license-file = "LICENSE"

[lints.clippy]
# erm, actually
pedantic = { level = "warn", priority = -1 }
# developing lints
nursery = { level = "warn", priority = -1 }
# deny panics
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

[dependencies]
